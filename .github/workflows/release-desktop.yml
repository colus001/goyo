name: Release Desktop

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify desktop version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches desktop package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./apps/desktop/package.json').version")"

          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version ($tag_version) does not match apps/desktop/package.json version ($package_version)."
            exit 1
          fi

  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: verify-version

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: dist:mac
          - name: Windows
            os: windows-latest
            script: dist:win
          - name: Linux
            os: ubuntu-latest
            script: dist:linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
          retention-days: 7

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native dependencies
        run: pnpm rebuild better-sqlite3

      - name: Check
        run: pnpm check

      - name: Verify macOS signing secrets
        if: matrix.name == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required macOS signing secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set up temporary macOS signing keychain
        if: matrix.name == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/goyo-signing.keychain-db"
          certificate="$(mktemp "$RUNNER_TEMP/goyo-certificate.XXXXXX")"
          trap 'rm -f "$certificate"' EXIT
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"

          # Persist the original search list for the cleanup step, one path per line.
          security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"$//' > "$RUNNER_TEMP/goyo-keychains.txt"
          original_keychains=()
          while IFS= read -r path; do
            original_keychains+=("$path")
          done < "$RUNNER_TEMP/goyo-keychains.txt"

          printf '%s' "$CSC_LINK" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -f pkcs12 -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "${original_keychains[@]}"
          security find-identity -v -p codesigning "$keychain" | grep -F 'Developer ID Application:'

      - name: Package signed macOS desktop
        if: matrix.name == 'macOS'
        run: pnpm --filter @writer/desktop ${{ matrix.script }} --config.forceCodeSigning=true
        env:
          CI: 'true'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Clean up temporary macOS signing keychain
        if: ${{ always() && matrix.name == 'macOS' }}
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/goyo-keychains.txt" ]; then
            original_keychains=()
            while IFS= read -r path; do
              original_keychains+=("$path")
            done < "$RUNNER_TEMP/goyo-keychains.txt"
            security list-keychains -d user -s "${original_keychains[@]}"
            rm -f "$RUNNER_TEMP/goyo-keychains.txt"
          fi
          if [ -f "$RUNNER_TEMP/goyo-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/goyo-signing.keychain-db"
          fi

      - name: Package desktop
        if: matrix.name != 'macOS'
        run: pnpm --filter @writer/desktop ${{ matrix.script }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 1
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.yml
            apps/desktop/dist/*.zip

      - name: Upload to R2
        shell: bash
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          bash ../../.github/scripts/upload-desktop-release.sh \
            ../desktop/dist "$(node -p "require('../desktop/package.json').version")"

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: package

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          generate_release_notes: true
