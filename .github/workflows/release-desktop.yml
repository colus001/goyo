name: Release Desktop

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify desktop version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches desktop package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./apps/desktop/package.json').version")"

          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version ($tag_version) does not match apps/desktop/package.json version ($package_version)."
            exit 1
          fi

  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: verify-version

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: dist:mac
          - name: Windows
            os: windows-latest
            script: dist:win
          - name: Linux
            os: ubuntu-latest
            script: dist:linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native dependencies
        run: pnpm rebuild better-sqlite3

      - name: Check
        run: pnpm check

      - name: Verify macOS signing secrets
        if: matrix.name == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required macOS signing secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Package signed macOS desktop
        if: matrix.name == 'macOS'
        run: pnpm --filter @writer/desktop ${{ matrix.script }}
        env:
          CI: 'true'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package desktop
        if: matrix.name != 'macOS'
        run: pnpm --filter @writer/desktop ${{ matrix.script }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.yml
            apps/desktop/dist/*.zip

      - name: Upload to R2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd apps/worker
          VERSION=$(node -p "require('../desktop/package.json').version")
          for f in ../desktop/dist/*; do
            if [ -f "$f" ]; then
              base=$(basename "$f")
              case "$base" in
                *.dmg)
                  npx wrangler --config wrangler.jsonc r2 object put goyo-releases/releases/Goyo.dmg --file "$f" --remote
                  npx wrangler --config wrangler.jsonc r2 object put "goyo-releases/releases/v${VERSION}/${base}" --file "$f" --remote
                  ;;
                *.exe)
                  npx wrangler --config wrangler.jsonc r2 object put goyo-releases/releases/Goyo-Setup.exe --file "$f" --remote
                  npx wrangler --config wrangler.jsonc r2 object put "goyo-releases/releases/v${VERSION}/${base}" --file "$f" --remote
                  ;;
                *.AppImage)
                  npx wrangler --config wrangler.jsonc r2 object put goyo-releases/releases/Goyo.AppImage --file "$f" --remote
                  npx wrangler --config wrangler.jsonc r2 object put "goyo-releases/releases/v${VERSION}/${base}" --file "$f" --remote
                  ;;
                *.deb)
                  npx wrangler --config wrangler.jsonc r2 object put goyo-releases/releases/Goyo.deb --file "$f" --remote
                  npx wrangler --config wrangler.jsonc r2 object put "goyo-releases/releases/v${VERSION}/${base}" --file "$f" --remote
                  ;;
                *.blockmap)
                  npx wrangler --config wrangler.jsonc r2 object put "goyo-releases/releases/v${VERSION}/${base}" --file "$f" --remote
                  ;;
                *.yml)
                  npx wrangler --config wrangler.jsonc r2 object put "goyo-releases/releases/${base}" --file "$f" --remote
                  ;;
              esac
            fi
          done

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: package

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          generate_release_notes: true
